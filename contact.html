<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Brianna Unframed</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Brianna Unframed Logo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <div class="contact-card">
        <h1>Get in touch</h1>
        <p class="lead">Questions, commissions, or collaborations — send a message and I'll get back to you.</p>

        <!--
          If you have a real form endpoint, set the form's action attribute to it.
          Example: action="https://formspree.io/f/your-form-id" method="POST"
          If no action is set the script will simulate a success message locally.
        -->
        <form id="contact-form" novalidate>
          <div class="form-grid">
            <label class="field">
              <span class="field-label">Your name</span>
              <input name="name" type="text" placeholder="Brianna" required aria-required="true">
              <span class="field-error" aria-live="polite"></span>
            </label>

            <label class="field">
              <span class="field-label">Email</span>
              <input name="email" type="email" placeholder="you@example.com" required aria-required="true">
              <span class="field-error" aria-live="polite"></span>
            </label>

            <label class="field field-full">
              <span class="field-label">Subject</span>
              <input name="subject" type="text" placeholder="Commission inquiry / General question" required>
              <span class="field-error" aria-live="polite"></span>
            </label>

            <label class="field field-full">
              <span class="field-label">Message</span>
              <textarea name="message" rows="6" placeholder="Tell me about your project or question..." required></textarea>
              <span class="field-error" aria-live="polite"></span>
            </label>

            <label class="field-consent">
              <input name="consent" type="checkbox" value="yes">
              <span>Subscribe to occasional updates and new artwork notices</span>
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Send message</button>
            <div class="form-status" aria-live="polite"></div>
          </div>
        </form>

        <div class="contact-info">
          <strong>Studio</strong>
          <p>Hilo, Hawai‘i • Open studio hours listed on the homepage</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Brianna Unframed | Designed by Brianna B</p>
  </footer>

  <script>
  (function () {
    const form = document.getElementById('contact-form');
    const btn = form.querySelector('button[type="submit"]');
    const statusEl = form.querySelector('.form-status');

    function showError(field, message) {
      const error = field.querySelector('.field-error') || field.parentElement.querySelector('.field-error');
      if (error) error.textContent = message;
      field.querySelector('input, textarea')?.setAttribute('aria-invalid', 'true');
    }

    function clearErrors() {
      form.querySelectorAll('.field-error').forEach(e => e.textContent = '');
      form.querySelectorAll('[aria-invalid="true"]').forEach(i => i.removeAttribute('aria-invalid'));
      statusEl.textContent = '';
      statusEl.className = 'form-status';
    }

    function validate() {
      clearErrors();
      let valid = true;

      const name = form.elements['name'];
      const email = form.elements['email'];
      const subject = form.elements['subject'];
      const message = form.elements['message'];

      if (!name.value.trim()) {
        showError(name.closest('.field'), 'Please enter your name.');
        valid = false;
      }
      if (!email.value.trim()) {
        showError(email.closest('.field'), 'Please enter your email.');
        valid = false;
      } else {
        // simple email regex
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!re.test(email.value)) {
          showError(email.closest('.field'), 'Please enter a valid email address.');
          valid = false;
        }
      }
      if (!subject.value.trim()) {
        showError(subject.closest('.field'), 'Please add a short subject.');
        valid = false;
      }
      if (!message.value.trim()) {
        showError(message.closest('.field'), 'Please add your message.');
        valid = false;
      }
      return valid;
    }

    async function handleSubmit(ev) {
      ev.preventDefault();
      clearErrors();
      if (!validate()) return;

      btn.disabled = true;
      btn.textContent = 'Sending...';

      // If the form has an action attribute, we'll submit to it.
      // If not, we simulate success locally.
      const action = form.getAttribute('action');

      if (action) {
        try {
          const data = new FormData(form);
          const response = await fetch(action, {
            method: (form.getAttribute('method') || 'POST').toUpperCase(),
            body: data,
            headers: (action.includes('formspree.io') ? {} : {}) // Formspree expects form-encoded POST; fetch handles FormData automatically
          });

          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          // success
          statusEl.textContent = 'Thanks — your message has been sent.';
          statusEl.classList.add('success');
          form.reset();
        } catch (err) {
          statusEl.textContent = 'Sorry, there was a problem sending your message. Try again later.';
          statusEl.classList.add('error');
          console.error(err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send message';
        }
      } else {
        // No backend defined: simulate a success response
        await new Promise(r => setTimeout(r, 750));
        statusEl.textContent = 'This is a demo. To actually submit messages, set the form action to your endpoint (e.g. Formspree).';
        statusEl.classList.add('success');
        form.reset();
        btn.disabled = false;
        btn.textContent = 'Send message';
      }
    }

    form.addEventListener('submit', handleSubmit);

    // Optional: clear field error on input
    form.addEventListener('input', (e) => {
      const f = e.target.closest('.field');
      if (!f) return;
      const err = f.querySelector('.field-error');
      if (err) err.textContent = '';
      e.target.removeAttribute('aria-invalid');
      statusEl.textContent = '';
    });
  })();
  </script>
</body>
</html>
